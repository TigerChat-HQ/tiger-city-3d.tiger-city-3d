<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1720" />
    <meta name="description" content="TIGER CITY 3D — jenga jiji, simamia jeshi na panua himaya yako." />
    <title>TIGER CITY 3D</title>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <header class="topbar">
        <div class="brand"><span class="brand-mark">T</span><div><strong>TIGER CITY</strong><small>3D COMMAND</small></div></div>
        <div class="resources"><span>🪙 <b id="coins">12000</b></span><span>👥 <b id="population">850</b></span><span>🛡️ <b id="army">120</b></span></div>
      </header>
      <section class="mission-card"><small>JUKUMU LA MEYA</small><strong id="mission">Panua jiji lako na ujenge makao makuu</strong><span id="status">Mji wako uko salama</span></section>
      <nav class="toolbar" aria-label="Game tools">
        <button class="tool active" data-mode="select">⌖<small>Chagua</small></button>
        <button class="tool" data-mode="house">⌂<small>Nyumba</small></button>
        <button class="tool" data-mode="shop">▣<small>Duka</small></button>
        <button class="tool" data-mode="office">▥<small>Ofisi</small></button>
        <button class="tool" data-mode="barracks">⚑<small>Kambi</small></button>
        <button class="tool" data-mode="army">⚔<small>Jeshi</small></button>
      </nav>
      <div class="action-row">
        <button id="rotate">⟳ Zungusha</button><button id="zoom-in">＋</button><button id="zoom-out">－</button><button id="save">Hifadhi</button>
      </div>
      <section class="battle-panel" id="battle-panel" hidden>
        <div><b>OPERESHENI: MIPAKA YA KASKAZINI</b><small id="battle-status">Vikosi vinasubiri amri</small></div>
        <button id="attack">ANZISHA VITA</button>
      </section>
      <div class="toast" id="toast" role="status"></div>
      <div class="hint" id="hint">Buruta kuzungusha kamera · Bana ku-zoom · Gusa ardhi kujenga</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
