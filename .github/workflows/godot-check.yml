name: Godot project validation

on:
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-check.yml'
  push:
    branches:
      - migration/godot-android-prototype
      - feat/standalone-android-app
    paths:
      - 'godot/**'
      - '.github/workflows/godot-check.yml'
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot 4.4.1 headless editor
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -o godot.zip
          unzip godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
      - name: Import and parse project scripts
        run: |
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot --quit
      - name: Run campaign AI, pathfinding, formations and battle integration tests
        run: |
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://tests/war_systems_smoke_test.gd
